name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    uses: noldova-com/.github/.github/workflows/build-and-test.yml@03e1936493a45d8c0dd8e80bc247980a116fa9a6 # trial, before v2.1.0
    permissions:
      contents: read
      packages: read
    with:
      targets: linux-x64 windows-x64
      publishes: true
      tool-from-source: true

  versions:
    name: Versions
    uses: noldova-com/.github/.github/workflows/versions.yml@03e1936493a45d8c0dd8e80bc247980a116fa9a6 # trial, before v2.1.0
    permissions: {}
    with:
      targets: linux-x64 windows-x64

  version-check:
    name: Version check
    needs: versions
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 10
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Check that the build refuses a version that isn't one
        shell: bash
        run: |
          if output="$(npm run build -- --version 01.0.0 2>&1)"; then
            printf '%s\n' "$output"
            echo '::error::npm run build -- --version 01.0.0 must fail.'
            exit 1
          fi
          printf '%s\n' "$output"
          if [[ "$output" != *'"01.0.0" is not a version'* ]]; then
            echo "::error::npm run build -- --version 01.0.0 must fail with the published Version's message."
            exit 1
          fi
          echo "The build refused --version 01.0.0 with the published Version's message."
