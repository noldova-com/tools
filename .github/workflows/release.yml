name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, major.minor.patch, which version.json holds at the commit
        required: true
        type: string
      commit:
        description: The full id of the commit on main to release
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  npm_config_ignore_scripts: 'true'
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_COMMIT: ${{ inputs.commit }}

jobs:
  versions:
    name: Versions
    uses: noldova-com/.github/.github/workflows/versions.yml@6e2ab8efb06aff6f0fdb9c4ac91c623c74359c30 # v1.0.0
    permissions: {}
    with:
      targets: linux-x64

  check:
    name: Check and build
    needs: versions
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Refuse a run from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          echo "::error::A release runs from main only, not from $RUN_REF."
          exit 1

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the commit, if it is on main
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::\"$RELEASE_COMMIT\" is not a commit: a commit is given by its full id, 40 lowercase hexadecimal digits."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main 2> /dev/null; then
            echo "::error::The commit $RELEASE_COMMIT is not on main."
            exit 1
          fi
          git checkout --quiet --detach "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false
          registry-url: ${{ needs.versions.outputs.install-registry-url }}
          scope: ${{ needs.versions.outputs.install-scope }}

      - name: Verify the toolchain
        env:
          NODE_VERSION: ${{ needs.versions.outputs.node-version }}
          NPM_VERSION: ${{ needs.versions.outputs.npm-version }}
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          if [ -n "$NPM_VERSION" ]; then
            test "$(npm --version)" = "$NPM_VERSION"
          fi

      - name: Build the packages
        run: npm run build

      - name: Check that the commit is on main and holds the version
        run: node_modules/.bin/pipelines source "$RELEASE_VERSION" "$RELEASE_COMMIT"

      - name: Check the archives
        env:
          RELEASE_SCOPE: ${{ needs.versions.outputs.publish-scope }}
        run: node_modules/.bin/pipelines archive _packages "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_SCOPE"

      - name: Keep the archives for releasing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: _packages/*.tgz
          if-no-files-found: error
          retention-days: ${{ needs.versions.outputs.retention-days }}

  publish:
    name: Publish to npm
    needs: [versions, check]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Verify the toolchain
        env:
          NODE_VERSION: ${{ needs.versions.outputs.node-version }}
          NPM_VERSION: ${{ needs.versions.outputs.npm-version }}
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          if [ -n "$NPM_VERSION" ]; then
            test "$(npm --version)" = "$NPM_VERSION"
          fi

      - name: Take the checked archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/archives

      - name: Install the tool from the checked archives
        run: |
          npm install --prefix "$RUNNER_TEMP/tool" --no-audit --no-fund "$RUNNER_TEMP"/archives/*.tgz
          echo "$RUNNER_TEMP/tool/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Publish the packages
        env:
          npm_config_provenance: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_REGISTRY: ${{ needs.versions.outputs.publish-registry-url }}
          RELEASE_SCOPE: ${{ needs.versions.outputs.publish-scope }}
          RELEASE_ACCESS: ${{ needs.versions.outputs.publish-access }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            registry_path="${RELEASE_REGISTRY#https:}"
            printf '%s:_authToken=${NPM_TOKEN}\n' "${registry_path%/}/" > "$RUNNER_TEMP/npmrc"
            export npm_config_userconfig="$RUNNER_TEMP/npmrc"
          fi
          pipelines publish "$RUNNER_TEMP/archives" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_SCOPE" "$RELEASE_REGISTRY" "$RELEASE_ACCESS"

  tag:
    name: Tag the commit
    needs: [versions, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Take the checked archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/archives

      - name: Install the tool from the checked archives
        run: |
          npm install --prefix "$RUNNER_TEMP/tool" --no-audit --no-fund "$RUNNER_TEMP"/archives/*.tgz
          echo "$RUNNER_TEMP/tool/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Tag the commit with the version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pipelines tag "$RELEASE_VERSION" "$RELEASE_COMMIT"
